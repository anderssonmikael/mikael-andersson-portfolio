<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Mikael Andersson | Contact</title>
  </head>
  <body>
    <header>
      <nav aria-label="Navigation menu" class="navbar">
        <ul class="navbar-list">
          <li aria-label="Home Page"><a href="index.html">Home</a></li>
          <li aria-label="About Page"><a href="about.html">About</a></li>
          <li aria-label="Projects Page">
            <a href="projects.html">Projects</a>
          </li>
          <li aria-label="Contact Page"><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="contact">
        <h1>Contact me.</h1>
        <form>
          <div class="field">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="John Doe"
              required
            />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="johndoe@hotmail.com"
              required
            />
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="Write your message here..."
              required
            ></textarea>
          </div>

          <button class="contact-button" type="submit">Send message</button>
        </form>
      </div>
    </main>
    <footer>
      <p class="copyright">&copy; Mikael Andersson 2026</p>
    </footer>
  </body>
</html>
